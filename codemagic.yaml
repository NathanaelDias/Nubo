# Compila Nubo en la nube: no hace falta instalar Flutter ni Android Studio.
# Cada vez que se sube un cambio a la rama main, Codemagic genera el APK
# y envía por correo el enlace para instalarlo en el móvil.
workflows:
  nubo-apk-prueba:
    name: Nubo · APK de prueba
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Preparar Android
        script: bash tool/prepare_android.sh
      - name: Dependencias
        script: flutter pub get
      - name: Arreglar plugins (AGP 9)
        script: bash tool/fix_plugins.sh
      - name: Icono de la app
        script: dart run flutter_launcher_icons
      - name: Compilar APK
        # Firmado con la clave de pruebas: sirve para instalarlo en tu móvil.
        # Para Google Play se creará otro flujo con tu clave de firma y un .aab.
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - nathanaelrocknoel@gmail.com
        notify:
          success: true
          failure: true
