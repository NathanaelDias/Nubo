<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Sudoku de colores</title></head>
<body><script src="kit.js"></script>
<script>
(() => {
const COL = ['#E5484D', '#3E7BFA', '#F5B82E', '#2DB57A', '#8E5CF7', '#F07A2B', '#FF6FA8', '#22B8CF', '#8A5A33'];
const SET = { colores: ['●', '▲', '■', '◆', '★', '♥', '✚', '⬟', '⬢'], frutas: ['🍎', '🫐', '🍋', '🍏', '🍇', '🍊', '🍑', '🥥', '🥝'], animales: ['🐶', '🐱', '🐤', '🐸', '🦄', '🦊', '🐷', '🐳', '🐼'] };
let ctx, N, BR, BC, sol, puz, cur, sel, mist, t0, hints;
const boxOf = (r, c) => Math.floor(r / BR) * BR + Math.floor(c / BC);
function fill(g, r) { for (let i = 0; i < N * N; i++) { const y = i / N | 0, x = i % N; if (g[y][x] >= 0) continue;
    for (const v of Kit.shuffle([...Array(N).keys()], r)) { if (ok(g, y, x, v)) { g[y][x] = v; if (fill(g, r)) return true; g[y][x] = -1; } } return false; } return true; }
function ok(g, y, x, v) { for (let k = 0; k < N; k++) if (g[y][k] === v || g[k][x] === v) return false;
  const by = Math.floor(y / BR) * BR, bx = Math.floor(x / BC) * BC; for (let a = 0; a < BR; a++) for (let b = 0; b < BC; b++) if (g[by + a][bx + b] === v) return false; return true; }
function count(g, lim = 2) { let n = 0; (function rec() { if (n >= lim) return; let best = null, bo = null;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (g[y][x] < 0) { const o = []; for (let v = 0; v < N; v++) if (ok(g, y, x, v)) o.push(v); if (!best || o.length < bo.length) { best = [y, x]; bo = o; } if (!o.length) return; }
    if (!best) { n++; return; } for (const v of bo) { g[best[0]][best[1]] = v; rec(); g[best[0]][best[1]] = -1; if (n >= lim) return; } })(); return n; }
function start(c) {
  ctx = c; const d = c.diff; [N, BR, BC] = d <= 4 ? [4, 2, 2] : d <= 18 ? [6, 2, 3] : [9, 3, 3]; const r = c.r;
  sol = Array.from({ length: N }, () => Array(N).fill(-1)); fill(sol, r);
  puz = sol.map(row => row.slice()); const target = N === 4 ? 8 + Math.min(d, 3) : N === 6 ? 16 + Math.min(d - 4, 8) : 40 + Math.min(d - 18, 14);
  let removed = 0; for (const i of Kit.shuffle([...Array(N * N).keys()], r)) { if (removed >= target) break; const y = i / N | 0, x = i % N, v = puz[y][x]; puz[y][x] = -1;
    if (count(puz.map(q => q.slice())) !== 1) puz[y][x] = v; else removed++; }
  cur = puz.map(row => row.slice()); sel = 0; mist = 0; t0 = Date.now(); hints = 0;
  c.stage.style.flexDirection = 'column'; c.stage.style.gap = '14px';
  c.stage.innerHTML = `<div id="g" style="display:grid;grid-template-columns:repeat(${N},1fr);width:min(100%,${N === 9 ? 400 : 340}px);aspect-ratio:1;background:#1D2340;border:3px solid #1D2340;border-radius:12px;overflow:hidden;gap:1px"></div><div id="pal" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:400px"></div>`;
  c.tools([{ t: '💡 Pista · 25', fn: hint }, { t: '⌫ Borrar', fn: () => { sel = -1; drawPal(); } }]); drawPal(); draw();
}
const sym = v => { const t = Kit.theme(), S = SET[t] || SET.colores; return t === 'colores' || !SET[t] ? `<span style="color:rgba(255,255,255,.85)">${S[v]}</span>` : S[v]; };
const bg = v => (Kit.theme() === 'colores' || !SET[Kit.theme()]) ? COL[v] : '#fff';
function drawPal() { const p = ctx.stage.querySelector('#pal'); p.innerHTML = [...Array(N).keys()].map(v => { const left = N - cur.flat().filter(x => x === v).length;
  return `<button data-v="${v}" style="width:${N === 9 ? 36 : 46}px;height:${N === 9 ? 36 : 46}px;border-radius:12px;background:${bg(v)};border:3px solid ${sel === v ? '#1D2340' : 'transparent'};font-size:${N === 9 ? 17 : 22}px;display:grid;place-items:center;opacity:${left ? 1 : .3};transform:scale(${sel === v ? 1.12 : 1});box-shadow:0 3px 0 rgba(0,0,0,.15)">${sym(v)}</button>`; }).join('');
  p.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { sel = +b.dataset.v; Kit.tone(500 + sel * 40, .04, 'triangle'); drawPal(); draw(); }); }
function draw() { const g = ctx.stage.querySelector('#g'); g.innerHTML = '';
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const v = cur[y][x], given = puz[y][x] >= 0, wrong = v >= 0 && v !== sol[y][x], same = sel >= 0 && v === sel;
    const e = Kit.h(`<button style="background:${v >= 0 ? bg(v) : (boxOf(y, x) % 2 ? '#F4F5FB' : '#fff')};display:grid;place-items:center;font-size:${N === 9 ? 18 : 26}px;
      margin-right:${(x + 1) % BC === 0 && x < N - 1 ? 2 : 0}px;margin-bottom:${(y + 1) % BR === 0 && y < N - 1 ? 2 : 0}px;${given ? 'box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)' : ''};${wrong ? 'outline:3px solid #E5484D;outline-offset:-3px;animation:wr .3s' : ''};${same && !given ? 'filter:brightness(1.1)' : ''}">${v >= 0 ? sym(v) : ''}${given ? '' : ''}</button>`);
    e.onclick = () => put(y, x); g.appendChild(e); }
  ctx.info(`${'❤'.repeat(3 - mist)}${'♡'.repeat(mist)} · ${cur.flat().filter(v => v < 0).length} vacías`); }
function put(y, x) { if (puz[y][x] >= 0) return; if (sel < 0) { cur[y][x] = -1; draw(); drawPal(); return; }
  cur[y][x] = sel; if (sel !== sol[y][x]) { mist++; Kit.tone(150, .15, 'sawtooth'); Kit.buzz(60); draw(); if (mist >= 3) setTimeout(() => ctx.lose('Tres errores. Fíjate en filas, columnas y bloques.'), 400);
    setTimeout(() => { if (cur[y][x] !== sol[y][x]) { cur[y][x] = -1; draw(); } }, 700); return; }
  Kit.tone(700 + sel * 40, .06, 'triangle'); draw(); drawPal();
  if (cur.every((row, a) => row.every((v, b) => v === sol[a][b]))) { const s = (Date.now() - t0) / 1000, par = N * N * 1.5; ctx.win(mist === 0 && !hints && s < par ? 3 : mist <= 1 ? 2 : 1, { text: `Completado en ${Math.round(s)} s` }); } }
function hint() { if (Kit.coins() < 25) return Kit.toast('Necesitas 25 monedas'); const e = []; cur.forEach((r, y) => r.forEach((v, x) => { if (v !== sol[y][x]) e.push([y, x]); })); if (!e.length) return;
  Kit.addCoins(-25); hints++; const [y, x] = e[Math.floor(Math.random() * e.length)]; cur[y][x] = sol[y][x]; draw(); drawPal(); }

Kit.game({ id: 'sudoku', name: 'Sudoku de colores', map: 'islas', mood: 'calma', color: 'linear-gradient(135deg,#FBCFE8,#DB2777)', levels: 60,
  css: '@keyframes wr{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}',
  tagline: 'Cada fila, columna y bloque lleva todos los colores una sola vez. Empieza en 4×4 y llega a 9×9.',
  tutorial: [['🎨', 'Elige un color', 'Toca un color de la paleta de abajo.', '🟥 🟦 🟨 🟩'], ['👆', 'Toca una casilla vacía', 'Cada fila, cada columna y cada bloque deben tener todos los colores, sin repetir.', null], ['❤', 'Tres errores', 'Si pones un color que no va, se marca en rojo. Con tres errores pierdes.', null]],
  art: '<svg viewBox="0 0 70 70">' + [0, 1, 2].map(y => [0, 1, 2].map(x => `<rect x="${10 + x * 17}" y="${10 + y * 17}" width="15" height="15" rx="3" fill="${['#fff', '#FFD23F', '#93C5FD', '#86EFAC', '#fff', '#FCA5A5', '#FCA5A5', '#93C5FD', '#fff'][y * 3 + x]}"/>`).join('')).join('') + '</svg>',
  themes: [{ id: 'colores', name: 'Colores', pv: '🟪', bg: '#FCE7F3' }, { id: 'frutas', name: 'Frutas', cost: 100, pv: '🍓', bg: '#FFF4D6' }, { id: 'animales', name: 'Animales', cost: 120, pv: '🐼', bg: '#E0F2FE' }],
  onTheme: () => ctx && (drawPal(), draw()), start });
})();
</script></body></html>
